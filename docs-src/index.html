<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Žaidimų kūrėjas</title>
<link rel="stylesheet" href="css/host.css">
</head>
<body>
<div id="app">
  <h1>Žaidimų kūrėjas</h1>
  <p class="hint-text">
    Žaidimai saugomi šios naršyklės atmintyje — jie nepasiekiami iš kitų įrenginių ar naršyklių.
  </p>

  <div class="list-actions">
    <a href="editor.html" id="new-game-cta">+ Naujas žaidimas</a>
    <button type="button" id="export-all-btn" class="secondary-btn">⭳ Eksportuoti visus</button>
    <label for="import-games-input" class="secondary-btn">⭱ Importuoti</label>
    <input type="file" id="import-games-input" accept="application/json,.json,application/zip,.zip" multiple class="file-input-hidden">
  </div>

  <p id="games-error"></p>

  <div id="default-rules">
    <p class="hint-text">Šios taisyklės automatiškai pridedamos kiekvienam naujam žaidimui.</p>
    <p id="default-rules-status" class="hint-text"></p>
  </div>

  <div id="drafts-section" hidden>
    <p class="section-label">Juodraščiai:</p>
    <div id="draft-list"></div>
    <hr class="section-divider games-divider">
  </div>

  <p class="section-label">Sukurti žaidimai:</p>
  <div id="game-list"></div>
</div>
<script src="js/vendor/jszip.min.js"></script>
<script src="js/game-shared.js"></script>
<script src="js/game-media-zip.js"></script>
<script src="js/game-editor-core.js"></script>
<script src="js/media-store.js"></script>
<script src="js/storage.js"></script>
<script src="js/game-files.js"></script>
<script src="js/games-list.js"></script>
</body>
</html>
